<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>票券批量修改工具</title>

    <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="onOpenCvReady()"></script>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>

    <style>
        /* 樣式定義：使用 CSS 變數管理顏色，確保風格統一 */
        :root { --red: #ff4d4f; --green: #52c41a; --blue: #1890ff; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 1300px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* 響應式佈局：當螢幕寬度小於 900px 時改為單欄顯示 */
        .layout { display: grid; grid-template-columns: 400px 1fr; gap: 20px; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

        .status-bar { background: #e6f7ff; border: 1px solid #91d5ff; padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; font-weight: bold; }
        .panel { display: flex; flex-direction: column; gap: 15px; }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 8px; background: #fafafa; position: relative; width: 100%; box-sizing: border-box; }

        /* 操作說明對話框按鈕 */
        .guide-btn { position: absolute; top: 10px; right: 10px; background: #6c757d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        textarea { width: 100%; height: 120px; border: 1px solid #ddd; padding: 8px; box-sizing: border-box; line-height: 1.5; font-size: 14px; }

        /* 繪製模式切換器樣式 */
        .mode-selector { display: flex; gap: 5px; margin-bottom: 10px; }
        .mode-btn { flex: 1; padding: 8px; border: 2px solid #ddd; background: white; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .mode-btn.active[data-type="barcode"] { background: var(--red); color: white; border-color: var(--red); }
        .mode-btn.active[data-type="sn"] { background: var(--green); color: white; border-color: var(--green); }
        .mode-btn.active[data-type="note"] { background: var(--blue); color: white; border-color: var(--blue); }

        /* 樣式設定區塊內部配置 */
        .setting-group { margin-bottom: 15px; }
        .group-title { font-weight: bold; display: block; margin-bottom: 8px; color: #333; }
        .group-content { margin-left: 20px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .group-content span { min-width: 45px; font-size: 14px; }
        .setting-group:first-of-type .group-content span { min-width: 120px; }

        input[type="color"] { border: 1px solid #ccc; width: 35px; height: 30px; cursor: pointer; background: none; padding: 0; border-radius: 4px; }
        select { padding: 4px; border-radius: 4px; border: 1px solid #ddd; width: 100px; }
        hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }

        /* 畫布容器：負責管理大圖顯示與手動框選 */
        .canvas-container { position: relative; border: 2px solid #444; background: #666; overflow: auto; max-height: 95vh; border-radius: 4px; }
        canvas { display: block; margin: 0 auto; cursor: crosshair; max-width: 100%; height: auto; }

        .btn-main { width: 100%; padding: 15px; background: #000; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-download { width: 100%; padding: 15px; background: var(--green); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; display: none; }

        #previewArea { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .preview-item { text-align: center; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .preview-item img { width: 100%; border: 1px solid #ddd; cursor: zoom-in; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; cursor: zoom-out; }
        #modal img { max-width: 95%; max-height: 95%; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-bar">⏳ 正在載入引擎...</div>

    <div class="layout">
        <div class="panel">
            <div class="card">
                <button class="guide-btn" onclick="document.getElementById('guide-dialog').showModal()">📖 說明 📖</button>
                <dialog id="guide-dialog" style="width: 90%; max-width: 400px; border-radius: 8px; border: 1px solid #ccc; padding: 50px;">
                    <h3 style="margin-top: 0;">⚠️ 注意</h3>
                    <div style="line-height: 1.8; text-align: left;">
                        1. 目前只支援 CODE-128。<br>
                        2. 所有處理均在瀏覽器完成，不會上傳資料。
                    </div>
                    <h3 style="margin-top: 15px;">📖 使用說明</h3>
                    <div style="line-height: 1.8; text-align: left;">
                        1. 序號定位：資料第一行請填寫圖片上現有序號。<br>
                        2. 自動偵測：上傳圖片，系統會自動標註紅框(條碼)與綠框(序號)。<br>
                        3. 修改/新增：左鍵畫框（新增）、右鍵點框（刪除）。<br>
                        4. 文字大小： 高度自動跟隨框框，寬度允許超出。<br>
                        5. 樣式調整： 可修改文字色彩，並切換對齊方式。<br>
                        6. 下載： 預覽滿意後即可下載ZIP。
                    </div>
                    <button onclick="this.closest('dialog').close()" style="float: right; margin-top: 10px; padding: 5px 15px;">關閉</button>
                </dialog>

                <label><b>1. 輸入資料 (序號,自定義文字)</b></label>
                <textarea id="dataInput" placeholder="⚠️第一行請輸入圖上現有的序號以便定位&#10;例如:&#10;SN123456789,使用期限:2025/01/31~2026/01/31&#10;SN987654321,使用期限:2025/01/31~2026/01/31"></textarea>
            </div>

            <div class="card">
                <label><b>2. 上傳底圖</b></label>
                <input type="file" id="imageInput" accept="image/*" style="width: 100%; margin-top: 10px;">
            </div>

            <div class="card">
                <label><b>3. 手動繪製模式</b></label>
                <div class="mode-selector">
                    <button class="mode-btn active" data-type="barcode">紅區 (條碼)</button>
                    <button class="mode-btn" data-type="sn">綠區 (序號)</button>
                    <button class="mode-btn" data-type="note">藍區 (自定義)</button>
                </div>
                <small style="color: #666;">※ 左鍵畫框 / 右鍵點框刪除</small>
            </div>

            <div class="card">
                <label style="font-size: 1.1em; border-bottom: 0.8px solid #333; display: block; margin-bottom: 15px;"><b>4. 樣式設定</b></label>
                <div class="setting-group">
                    <span class="group-title">底圖覆蓋</span>
                    <div class="group-content">
                        <span>條碼與文字底色：</span>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>
                </div>
                <hr>
                <div class="setting-group">
                    <span class="group-title">綠區文字</span>
                    <div class="group-content"><span>顏色：</span><input type="color" id="snColor" value="#000000"></div>
                    <div class="group-content">
                        <span>對齊：</span>
                        <select id="snAlign">
                            <option value="center">置中</option>
                            <option value="left">靠左</option>
                            <option value="right">靠右</option>
                        </select>
                    </div>
                </div>
                <hr>
                <div class="setting-group">
                    <span class="group-title">藍區文字</span>
                    <div class="group-content"><span>顏色：</span><input type="color" id="noteColor" value="#000000"></div>
                    <div class="group-content">
                        <span>對齊：</span>
                        <select id="noteAlign">
                            <option value="center" selected>置中</option>
                            <option value="left">靠左</option>
                            <option value="right">靠右</option>
                        </select>
                    </div>
                </div>
            </div>

            <button id="processBtn" class="btn-main">🚀 產生預覽</button>
            <button id="downloadBtn" class="btn-download">📦 下載全部 ZIP</button>
        </div>

        <div class="canvas-container"><canvas id="editorCanvas"></canvas></div>
    </div>

    <div id="previewArea"></div>
</div>

<div id="modal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>
<div style="display:none"><canvas id="renderCanvas"></canvas><svg id="barcodeSVG"></svg></div>

<script>
    /**
     * 變數初始化
     * boxes: 儲存所有標註區塊座標與類型
     * baseImg: 原始上傳圖片物件
     */
    let cvReady = false, boxes = [], baseImg = new Image(), currentMode = 'barcode';
    const canvas = document.getElementById('editorCanvas'), ctx = canvas.getContext('2d');
    let isDrawing = false, startX, startY;

    // OpenCV 載入完成通知
    function onOpenCvReady() { cvReady = true; updateStatus("✅ 引擎就緒，請上傳圖片。"); }
    function updateStatus(m) { document.getElementById('status').innerText = m; }
    function showModal(src) { document.getElementById('modalImg').src = src; document.getElementById('modal').style.display = 'flex'; }

    // 切換紅、綠、藍繪圖模式
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.type;
        };
    });

    // 處理圖片讀取邏輯
    document.getElementById('imageInput').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            baseImg.onload = () => {
                canvas.width = baseImg.width;
                canvas.height = baseImg.height;
                detectFeatures(); // 啟動自動辨識
            };
            baseImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    /**
     * AI 辨識模組：利用 OpenCV 找尋垂直條碼特徵，利用 Tesseract OCR 定位序號
     */
    async function detectFeatures() {
        updateStatus("🔍 正在辨識區域...");
        boxes = [];
        let src = cv.imread(baseImg);
        let gray = new cv.Mat(), gradX = new cv.Mat(), thresh = new cv.Mat(), closed = new cv.Mat(), contours = new cv.MatVector(), hierarchy = new cv.Mat();

        // 1. 偵測紅區 (條碼)：利用影像 Sobel 算子尋找高頻垂直線條
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.Sobel(gray, gradX, cv.CV_8U, 1, 0, 3);
        cv.threshold(gradX, thresh, 100, 255, cv.THRESH_BINARY);
        let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(40, 1));
        cv.morphologyEx(thresh, closed, cv.MORPH_CLOSE, kernel);
        cv.findContours(closed, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let bcCandidates = [];
        for (let i = 0; i < contours.size(); ++i) {
            let rect = cv.boundingRect(contours.get(i));
            // 篩選出長方形比例正確的條碼候選區
            if (rect.width > 100 && (rect.width / rect.height) > 2.5) bcCandidates.push(rect);
        }

        if (bcCandidates.length > 0) {
            bcCandidates.sort((a, b) => (b.width * b.height) - (a.width * a.height));
            let bcRect = bcCandidates[0];
            // 座標外擴 2% 左右，確保產出時能完美蓋掉舊圖
            let pW = bcRect.width * 0.02, pH = bcRect.height * 0.015;
            boxes.push({ x: Math.max(0, bcRect.x - pW), y: Math.max(0, bcRect.y - pH), w: bcRect.width + pW * 2, h: bcRect.height + pH * 2, type: 'barcode' });
        }

        // 2. 定位綠區 (序號)：比對圖中文字，精準抓取座標
        const rawSN = document.getElementById('dataInput').value.split('\n')[0].split(',')[0].trim();
        if (rawSN) {
            try {
                const worker = await Tesseract.createWorker();
                await worker.loadLanguage('eng');
                await worker.initialize('eng');
                const { data: { words } } = await worker.recognize(baseImg);
                words.forEach(w => {
                    let cleanText = w.text.replace(/[^a-zA-Z0-9]/g, '');
                    // 模糊匹配：內容包含且長度過半即判定為目標
                    if (rawSN.includes(cleanText) && cleanText.length > rawSN.length * 0.5) {
                        boxes.push({ x: w.bbox.x0 - 5, y: w.bbox.y0 - 5, w: (w.bbox.x1 - w.bbox.x0) + 10, h: (w.bbox.y1 - w.bbox.y0) + 10, type: 'sn' });
                    }
                });
                await worker.terminate();
            } catch(e) {}
        }

        // 記憶體清理：OpenCV 的 Mat 物件必須手動刪除以免溢出
        src.delete(); gray.delete(); gradX.delete(); thresh.delete(); closed.delete(); contours.delete(); hierarchy.delete(); kernel.delete();
        updateStatus("👌 完成辨識。");
        render();
    }

    /**
     * 更新渲染：繪製底圖與標註框線
     */
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(baseImg, 0, 0);

        // 計算縮放比例，確保螢幕上的框線粗細看起來一致
        const rect = canvas.getBoundingClientRect();
        const visualScale = canvas.width / rect.width;

        boxes.forEach(b => {
            ctx.lineWidth = 3 * visualScale;
            ctx.strokeStyle = b.type === 'barcode' ? '#ff4d4f' : (b.type === 'sn' ? '#52c41a' : '#1890ff');
            ctx.strokeRect(b.x, b.y, b.w, b.h);
        });
    }

    // 計算滑鼠在畫布上的正確座標（排除縮放干擾）
    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    // 手動標註邏輯
    canvas.onmousedown = (e) => {
        const pos = getMousePos(e);
        startX = pos.x; startY = pos.y;
        // 右鍵點擊：刪除該位置的現有框框
        if (e.button === 2) {
            boxes = boxes.filter(b => !(startX >= b.x && startX <= b.x+b.w && startY >= b.y && startY <= b.y+b.h));
            render(); return;
        }
        isDrawing = true;
    };

    canvas.onmousemove = (e) => {
        if (!isDrawing) return;
        render(); // 繪製時持續重繪以顯示當前虛線框
        const pos = getMousePos(e);
        const rect = canvas.getBoundingClientRect();
        const visualScale = canvas.width / rect.width;

        ctx.strokeStyle = currentMode === 'barcode' ? '#ff4d4f' : (currentMode === 'sn' ? '#52c41a' : '#1890ff');
        ctx.lineWidth = 2 * visualScale;
        ctx.setLineDash([5 * visualScale, 5 * visualScale]); // 使用虛線提示
        ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
        ctx.setLineDash([]);
    };

    canvas.onmouseup = (e) => {
        if (!isDrawing) return;
        const pos = getMousePos(e);
        let w = Math.abs(pos.x - startX), h = Math.abs(pos.y - startY);
        if (w > 5 && h > 5) boxes.push({ x: Math.min(startX, pos.x), y: Math.min(startY, pos.y), w, h, type: currentMode });
        isDrawing = false;
        render();
    };
    canvas.oncontextmenu = (e) => e.preventDefault(); // 禁用畫布選單以支援右鍵刪除

    /**
     * 批量處理：核心運算與產出
     */
    document.getElementById('processBtn').onclick = async () => {
        const data = document.getElementById('dataInput').value.trim();
        if (!data) return alert("請輸入序號");
        updateStatus("🚀 產出預覽中...");
        const lines = data.split('\n'), zip = new JSZip();
        const rCanvas = document.getElementById('renderCanvas'), rCtx = rCanvas.getContext('2d');
        rCanvas.width = baseImg.width; rCanvas.height = baseImg.height;
        const preview = document.getElementById('previewArea'); preview.innerHTML = "";

        // 循環每一行資料進行渲染
        for (let i = 0; i < lines.length; i++) {
            const [sn, note] = lines[i].split(',').map(s => s.trim());
            rCtx.drawImage(baseImg, 0, 0); // 貼上底圖
            for (let b of boxes) {
                // 第一步：用底色覆蓋原區域
                rCtx.fillStyle = document.getElementById('bgColor').value;
                rCtx.fillRect(b.x, b.y, b.w, b.h);
                // 第二步：渲染條碼或文字
                if (b.type === 'barcode') await drawBarcode(rCtx, sn, b);
                else if (b.type === 'sn') drawText(rCtx, sn, b, document.getElementById('snColor').value, document.getElementById('snAlign').value);
                else if (b.type === 'note') drawText(rCtx, note || "", b, document.getElementById('noteColor').value, document.getElementById('noteAlign').value);
            }
            // 轉為 Blob 並存入 ZIP 壓縮包
            const blob = await new Promise(res => rCanvas.toBlob(res, 'image/png')), url = URL.createObjectURL(blob);
            zip.file(`ticket_${i+1}.png`, blob);
            // 產生預覽項目
            const div = document.createElement('div'); div.className = "preview-item";
            div.innerHTML = `<img src="${url}" onclick="showModal('${url}')"><br><small>${sn}</small>`;
            preview.appendChild(div);
        }
        updateStatus("✅ 修改完成，請至下方查看預覽效果。");
        document.getElementById('downloadBtn').style.display = "block";
        document.getElementById('downloadBtn').onclick = async () => {
            const content = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(content); a.download = "output.zip"; a.click();
        };
    };

    /**
     * 產生條碼
     */
    function drawBarcode(tCtx, text, box) {
        return new Promise(res => {
            const svg = document.getElementById('barcodeSVG');
            JsBarcode(svg, text, { format: "CODE128", displayValue: false, background: "transparent", margin: 0 });
            const xml = new XMLSerializer().serializeToString(svg), img = new Image();
            img.onload = () => { tCtx.drawImage(img, box.x, box.y, box.w, box.h); res(); };
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
        });
    }

    /**
     * 產生文字
     */
    function drawText(tCtx, text, box, color, align) {
        tCtx.fillStyle = color;
        tCtx.textBaseline = "middle";
        let fontSize = box.h * 0.8; // 高度優先：文字高度為框高的 80%
        tCtx.font = `bold ${fontSize}px sans-serif`;
        if (align === 'center') { tCtx.textAlign = "center"; tCtx.fillText(text, box.x + box.w/2, box.y + box.h/2); }
        else if (align === 'left') { tCtx.textAlign = "left"; tCtx.fillText(text, box.x + 5, box.y + box.h/2); }
        else if (align === 'right') { tCtx.textAlign = "right"; tCtx.fillText(text, box.x + box.w - 5, box.y + box.h/2); }
    }
</script>
</body>
</html>
